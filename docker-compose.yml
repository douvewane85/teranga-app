version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: teranga_db
    environment:
      POSTGRES_USER: teranga_user
      POSTGRES_PASSWORD: teranga_password
      POSTGRES_DB: teranga_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: teranga_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@teranga.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  app:
    build: .
    container_name: teranga_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://teranga_user:teranga_password@db:5432/teranga_db?schema=public
    depends_on:
      - db
    volumes:
      - uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
