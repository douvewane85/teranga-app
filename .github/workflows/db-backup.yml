name: Scheduled Database Backup

on:
  schedule:
    # Chaque dimanche à 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permet de déclencher la sauvegarde manuellement depuis GitHub

permissions:
  contents: write # Nécessaire pour créer la release GitHub et y attacher le backup

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Set timestamp
        id: vars
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')" >> $GITHUB_ENV

      - name: Dump PostgreSQL database
        run: |
          docker run --rm postgres:18 pg_dump "${{ secrets.DATABASE_URL }}" | gzip > backup_${{ env.TIMESTAMP }}.sql.gz
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Create GitHub Release with Backup
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ env.TIMESTAMP }}
          name: "Database Backup - ${{ env.TIMESTAMP }}"
          body: |
            Sauvegarde automatique hebdomadaire de la base PostgreSQL (Neon).
            Date : ${{ env.TIMESTAMP }}
          files: backup_${{ env.TIMESTAMP }}.sql.gz
          draft: false
          prerelease: false
