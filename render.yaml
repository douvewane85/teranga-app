databases:
  - name: teranga-db
    plan: free
    databaseName: teranga_db
    user: teranga_user

services:
  - type: web
    name: teranga-app
    env: docker
    plan: free
    branch: develop
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teranga-db
          property: connectionString
